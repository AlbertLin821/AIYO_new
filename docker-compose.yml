services:
  app:
    build:
      context: ./aiyo
      dockerfile: Dockerfile
    container_name: aiyo-new-app
    env_file:
      - ./aiyo/.env
    environment:
      DATABASE_URL: postgresql://aiyo:aiyo_password@postgres:5432/aiyo_new_db?schema=public
      NEXTAUTH_URL: http://localhost:3000
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    command: sh -c "npx prisma migrate deploy && npm run start"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    container_name: aiyo-new-postgres
    environment:
      POSTGRES_USER: aiyo
      POSTGRES_PASSWORD: aiyo_password
      POSTGRES_DB: aiyo_new_db
    ports:
      - "5432:5432"
    volumes:
      - aiyo_new_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiyo -d aiyo_new_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: aiyo-new-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - aiyo_new_pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: aiyo-new-redis
    ports:
      - "6379:6379"
    volumes:
      - aiyo_new_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  aiyo_new_postgres_data:
  aiyo_new_pgadmin_data:
  aiyo_new_redis_data:

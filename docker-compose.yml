# AIYO_new Docker stack
# - Dev app:        http://127.0.0.1:3000
# - Prod-live app:  http://127.0.0.1:3001
# - Open WebUI:     http://127.0.0.1:8080
# - Postgres dev:   127.0.0.1:5432
# - Postgres live:  127.0.0.1:5433
# - Redis:          127.0.0.1:6379

services:
  aiyo-new-postgres-dev:
    image: pgvector/pgvector:pg16
    container_name: aiyo-new-postgres-dev
    environment:
      POSTGRES_USER: aiyo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_DEV:-aiyo_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB_DEV:-aiyo_new_dev_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aiyo_new_postgres_dev_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER_DEV:-aiyo} -d ${POSTGRES_DB_DEV:-aiyo_new_dev_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  aiyo-new-postgres-prod:
    image: pgvector/pgvector:pg16
    container_name: aiyo-new-postgres-prod
    environment:
      POSTGRES_USER: aiyo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_PROD:-aiyo_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB_PROD:-aiyo_new_prod_db}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - aiyo_new_postgres_prod_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER_PROD:-aiyo} -d ${POSTGRES_DB_PROD:-aiyo_new_prod_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  aiyo-new-redis:
    image: redis:7-alpine
    container_name: aiyo-new-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - aiyo_new_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.9.6
    container_name: open-webui
    environment:
      ENV: ${OPENWEBUI_ENV:-prod}
      PORT: "8080"
      WEBUI_URL: ${OPENWEBUI_PUBLIC_URL:-http://127.0.0.1:8080}
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: "false"
      ENABLE_API_KEYS: "true"
      ENABLE_API_KEYS_ENDPOINT_RESTRICTIONS: "true"
      API_KEYS_ALLOWED_ENDPOINTS: ${OPENWEBUI_ALLOWED_ENDPOINTS:-/api/models,/api/chat/completions,/ollama/api/chat,/ollama/api/tags}
      ENABLE_PERSISTENT_CONFIG: "false"
      WEBUI_SECRET_KEY: ${OPENWEBUI_SECRET_KEY:-replace-with-a-long-random-secret}
      WEBUI_ADMIN_EMAIL: ${OPENWEBUI_ADMIN_EMAIL:-admin@aiyo.local}
      WEBUI_ADMIN_PASSWORD: ${OPENWEBUI_ADMIN_PASSWORD:-ChangeThisOpenWebUiAdminPassword123!}
      WEBUI_ADMIN_NAME: ${OPENWEBUI_ADMIN_NAME:-AIYO Admin}
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - open_webui_data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    networks:
      - backend

  aiyo-new-app-dev:
    build:
      context: ./aiyo
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID:-}
        NEXT_PUBLIC_ENABLE_MOCK_MAPS: ${NEXT_PUBLIC_ENABLE_MOCK_MAPS:-}
    container_name: aiyo-new-app-dev
    env_file:
      - ./aiyo/.env.dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    command: sh -c "apk add --no-cache yt-dlp 2>/dev/null || true; mkdir -p /app/.next && find /app/.next -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true; npm install && npx prisma generate && npx prisma migrate deploy && npm run dev"
    volumes:
      - ./aiyo:/app
      - aiyo_new_node_modules_dev:/app/node_modules
      - aiyo_new_next_dev:/app/.next
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    depends_on:
      aiyo-new-postgres-dev:
        condition: service_healthy
      aiyo-new-redis:
        condition: service_healthy
      open-webui:
        condition: service_healthy
    networks:
      - backend

  aiyo-new-app-prod-live:
    build:
      context: ./aiyo
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
        NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: ${NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID:-}
        NEXT_PUBLIC_ENABLE_MOCK_MAPS: ${NEXT_PUBLIC_ENABLE_MOCK_MAPS:-}
    container_name: aiyo-new-app-prod-live
    env_file:
      - ./aiyo/.env.prod-live
    ports:
      - "127.0.0.1:3001:3000"
    command: sh -c "mkdir -p /app/.next && find /app/.next -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true; NODE_ENV=development npm install && npx prisma generate && npx prisma migrate deploy && NODE_ENV=production npm run build && npm run start"
    volumes:
      - ./aiyo:/app
      - aiyo_new_node_modules_prod_live:/app/node_modules
      - aiyo_new_next_prod_live:/app/.next
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 320s
    depends_on:
      aiyo-new-postgres-prod:
        condition: service_healthy
      aiyo-new-redis:
        condition: service_healthy
      open-webui:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  aiyo_new_postgres_dev_data:
  aiyo_new_postgres_prod_data:
  aiyo_new_redis_data:
  open_webui_data:
  aiyo_new_node_modules_dev:
  aiyo_new_node_modules_prod_live:
  aiyo_new_next_dev:
  aiyo_new_next_prod_live:

use_default_settings:
  engines:
    remove:
      - brave
      - brave.images
      - brave.videos
      - brave.news
      - wikidata
      - ahmia
      - torch

general:
  instance_name: "AIYO SearXNG"

server:
  secret_key: "replace-with-a-long-random-searxng-secret"
  limiter: false

search:
  safe_search: 1
  default_lang: "zh-TW"
  formats:
    - html
    - json
  languages:
    - zh-TW
    - zh-CN
    - en

ui:
  default_locale: ""

engines:
  - name: karmasearch
    disabled: true
  - name: karmasearch images
    disabled: true
  - name: karmasearch videos
    disabled: true
  - name: karmasearch news
    disabled: true
